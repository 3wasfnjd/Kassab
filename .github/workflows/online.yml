name: Deploy Kassab online server
on:
  push:
    branches: [main]
    paths: ['online/**', '.github/workflows/online.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check secrets
        id: sec
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          if [ -z "$T" ]; then echo "::warning::Add CLOUDFLARE_API_TOKEN in repo Settings > Secrets > Actions, then run this workflow again"; echo "ok=no" >> $GITHUB_OUTPUT; else echo "ok=yes" >> $GITHUB_OUTPUT; fi
      - name: Deploy worker
        if: steps.sec.outputs.ok == 'yes'
        working-directory: online
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f6fb852b9faeb761827bb662df031b29
        run: npx --yes wrangler@4 deploy
      - name: Publish the server address for the game
        if: steps.sec.outputs.ok == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f6fb852b9faeb761827bb662df031b29
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['subdomain'])")
          echo "{\"ws\":\"wss://kassab-online.$SUB.workers.dev/ws\"}" > online.json
          curl -s "https://kassab-online.$SUB.workers.dev/count" || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add online.json
          git diff --cached --quiet || (git commit -m "Online server address [skip ci]" && git push)
