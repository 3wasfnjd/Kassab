name: Claude joins Kassab online
on:
  workflow_dispatch:
    inputs:
      minutes: { description: 'How long to stay (minutes)', default: '20' }
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node online/bot.mjs "$(python3 -c "import json;print(json.load(open('online.json'))['ws'])")" "${{ inputs.minutes }}"
