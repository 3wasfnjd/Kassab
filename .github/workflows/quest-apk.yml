name: Kassab Quest APK · تطبيق الكويست
# Builds, tests and verifies the native Godot Meta Quest APK (quest/) on the quest-native branch.
# The APK is kept as a run artifact and also attached to the «quest-latest» pre-release, so the newest
# build always has the same direct download link.
on:
  push:
    branches: [quest-native]
    paths: ['quest/**', '.github/workflows/quest-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kassab-quest-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kassab-godot
          key: godot-4.6.3-stable-v1
      - name: Build, test and verify APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          OUT_DIR: ${{ github.workspace }}/build
        run: bash quest/tools/ci/build_apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kassab-quest-${{ github.run_number }}
          path: |
            build/*.apk
            build/*.sha256
            build/*.txt
            build/export.log
          if-no-files-found: warn
          retention-days: 7
      - name: Direct download link (quest-latest pre-release)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp "$APK" build/kassab-quest.apk
          gh release view quest-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create quest-latest -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Kassab Quest — آخر نسخة للتجربة" --notes "أحدث ملف APK لتطبيق كساب على Meta Quest (موقّع بمفتاح التجربة)."
          gh release upload quest-latest build/kassab-quest.apk -R "$GITHUB_REPOSITORY" --clobber
          echo "::notice::https://github.com/$GITHUB_REPOSITORY/releases/download/quest-latest/kassab-quest.apk"
