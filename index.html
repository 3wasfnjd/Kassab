<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>طعوس الهجولة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Baloo Bhaijaan 2";src:url("fonts/baloo-arabic.woff2") format("woff2");font-weight:400 800;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Baloo Bhaijaan 2";src:url("fonts/baloo-latin.woff2") format("woff2");font-weight:400 800;font-display:swap}
/* Layout: full-bleed WebGL canvas, touch controls pinned to the bottom corners. Single look (sun-baked sand), not theme-switched. */
:root{
  --sand:#d8c3a0; --ink:#2a2118; --glass:rgba(42,33,24,.38); --glass-hi:rgba(42,33,24,.62);
  --rim:rgba(255,240,215,.55); --accent:#f2a33a;
  --font:"Baloo Bhaijaan 2","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;position:fixed;inset:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--sand);color:#fff;font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 55%,rgba(60,38,15,.28) 100%)}
.hud{position:fixed;top:calc(4px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));width:236px;height:104px;pointer-events:none;
  color:rgba(236,255,244,.92);font-family:"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;direction:ltr;
  text-shadow:0 0 1px rgba(255,255,255,.9),0 0 6px rgba(150,255,200,.55),0 1px 3px rgba(10,40,25,.55)}
.hud svg{position:absolute;overflow:visible;filter:drop-shadow(0 0 3px rgba(150,255,200,.45)) drop-shadow(0 1px 1.5px rgba(10,40,25,.55))}
.hud .t{position:absolute;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .deg{top:2px;font-size:13px;letter-spacing:.5px}.hud .deg sup{font-size:8px;vertical-align:5px;margin-left:1px}
.hud .wd{left:44px;top:64px;width:30px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.5px}
.hud .cr{left:146px;top:0;font-size:13px;font-weight:600;color:#86ff9f;display:flex;align-items:center;gap:3px}
.hud .big{left:118px;top:13px;width:104px;text-align:center;font-size:40px;line-height:1;letter-spacing:1px}
.hud .un{left:118px;top:55px;width:104px;text-align:center;font-size:10px;font-weight:600;opacity:.85;letter-spacing:.5px}
.hud .lim{left:152px;top:69px;width:30px;height:30px;border-radius:50%;border:3.5px solid rgba(230,70,55,.88);background:rgba(240,250,246,.85);
  color:#24343a;text-shadow:none;display:grid;place-items:center;font-size:12px;font-weight:600;box-shadow:0 0 6px rgba(150,255,200,.35)}
.brand{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  text-align:center;line-height:1;opacity:.75;pointer-events:none;text-shadow:0 1px 5px rgba(60,35,10,.45)}
.brand{width:58px;height:auto;opacity:.92;filter:drop-shadow(0 1px 4px rgba(40,22,6,.45))}
body.title .brand{width:84px}
#reset{position:fixed;top:calc(76px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rim);background:var(--glass);color:#fff;font:600 18px var(--font);
  display:grid;place-items:center;padding:0}
#radio{position:fixed;top:calc(122px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:40px;height:40px;padding:0;border-radius:50%;
  border:1.5px solid var(--rim);background:var(--glass);color:#fff;display:grid;place-items:center}
#radio.on{border-color:var(--accent);color:var(--accent);background:var(--glass-hi)}
#steer{position:fixed;left:0;bottom:0;width:48%;height:58%;}
#wxBtn{position:fixed;top:calc(168px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;
  border:1.5px solid var(--rim);background:var(--glass);color:#fff;display:grid;place-items:center;padding:0}
#wxBtn.on{border-color:var(--accent);color:var(--accent);background:var(--glass-hi)}
#wxPanel{position:fixed;top:calc(168px + env(safe-area-inset-top,0px));right:calc(62px + env(safe-area-inset-right,0px));width:min(250px,60vw);padding:10px 10px 8px;
  border-radius:16px;border:1.5px solid var(--rim);background:rgba(58,40,22,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;direction:rtl;font:700 12px var(--font)}
#wxPanel[hidden]{display:none}
#wxPanel h6{margin:2px 4px 6px;font:800 12px var(--font);opacity:.75}
#wxPanel .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
#wxPanel button{height:44px;border-radius:11px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:700 12px var(--font);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
#wxPanel button i{font-style:normal;font-size:16px;line-height:1}
#wxPanel button.on{border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,.16)}
#knobBase{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  width:150px;height:64px;border-radius:32px;background:var(--glass);border:1.5px solid var(--rim)}
#knob{position:absolute;top:50%;left:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:rgba(255,245,228,.85);box-shadow:0 2px 10px rgba(50,30,10,.35)}
#knobBase::before,#knobBase::after{content:"";position:absolute;top:50%;margin-top:-7px;border:7px solid transparent}
#knobBase::before{left:10px;border-right-color:rgba(255,240,215,.7)}
#knobBase::after{right:10px;border-left-color:rgba(255,240,215,.7)}
.pads{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:auto auto;grid-template-rows:auto;gap:12px;align-items:end}
.btn{border-radius:50%;border:1.5px solid var(--rim);background:var(--glass);color:#fff;font:800 14px var(--font);
  display:grid;place-items:center;padding:0;touch-action:none}
.btn.on{background:var(--glass-hi);border-color:var(--accent);color:var(--accent)}
#gas{width:96px;height:96px;grid-column:2;grid-row:1;font-size:17px}
#brake{width:66px;height:66px;grid-column:1;grid-row:1}
#rot{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(232px + env(safe-area-inset-top,0px));width:40px;height:40px;
  display:grid;place-items:center;border-radius:12px;background:var(--glass-hi);border:1.5px solid var(--rim);color:#fff;pointer-events:none}
#rot svg{animation:tilt 2.4s ease-in-out infinite;transform-origin:50% 50%}
@keyframes tilt{0%,35%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){#rot svg{animation:none}}
@media (orientation:landscape){#rot{display:none}}
#map{position:fixed;top:calc(112px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));width:110px;height:110px;
  border-radius:14px;border:1.5px solid var(--rim);background:rgba(42,33,24,.35);touch-action:none}
#map.big{width:min(78vmin,420px);height:min(78vmin,420px);left:50%;top:50%;transform:translate(-50%,-50%);z-index:5}
#wx{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(86px + env(safe-area-inset-right,0px));font-size:13px;
  background:var(--glass);padding:3px 12px;border-radius:12px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
#toast{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(86vw,520px);text-align:center;
  background:var(--glass-hi);border:1.5px solid var(--accent);padding:6px 14px;border-radius:14px;font-size:15px;pointer-events:none}
#build{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass-hi);
  padding:4px 12px;border-radius:12px;font-size:13px;pointer-events:none}
#title{position:fixed;right:0;top:0;bottom:0;width:min(46vw,420px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-shadow:0 2px 14px rgba(40,22,6,.55)}
body.title #title{display:flex}
body.intro #title{display:none}
@media (orientation:portrait){#title{left:0;width:auto;top:auto;bottom:calc(26px + env(safe-area-inset-bottom,0px))}}
#title::before{content:"";position:absolute;inset:18% 4%;background:radial-gradient(closest-side,rgba(40,24,8,.32),rgba(40,24,8,0));z-index:-1}
#title h1{margin:0;font-size:clamp(46px,11vmin,92px);font-weight:800;line-height:1.05;color:#fff7ea;letter-spacing:.01em}
#title p{margin:0 0 12px;font-size:clamp(15px,3.6vmin,22px);font-weight:600;color:#ffe9c7}
#start{font:800 22px var(--font);color:#2a2118;background:#f2c27a;border:0;border-radius:16px;padding:8px 46px 10px;box-shadow:0 4px 0 #a9773a,0 10px 30px rgba(40,22,6,.35);cursor:pointer}
/* thin bar under the car on the title page (car sits on the left in landscape) */
#load{position:fixed;left:9%;width:32%;bottom:calc(14% + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:8px;direction:ltr;pointer-events:none}
body.title:not(.intro) #load{display:flex}
#load[hidden]{display:none!important}
#loadtrack{flex:1;height:4px;border-radius:2px;background:rgba(58,36,18,.22);overflow:hidden}
#loadbar{width:0;height:100%;background:#3a2412;transition:width .2s}
#loadtx{font-size:12px;font-weight:800;color:#3a2412;font-variant-numeric:tabular-nums}
@media (orientation:portrait){#load{left:20%;width:60%;bottom:calc(48% + env(safe-area-inset-bottom,0px))}}
[hidden]{display:none!important}
#start.show{animation:startIn .45s ease-out both}
@keyframes startIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#start.show{animation:none}}
#start:active{transform:translateY(3px);box-shadow:0 1px 0 #a9773a}
#start:focus-visible{outline:3px solid #fff;outline-offset:4px}
body.title .hud,body.title #map,body.title #reset,body.title #radio,body.title #steer,body.title .pads,body.title #wx,body.title #rot,body.title #build,body.title #wxBtn,body.title #wxPanel{display:none!important}
#err{position:fixed;inset:auto 16px 50% 16px;text-align:center;color:var(--ink);font-size:15px}
</style>
</head>

<script>
(function(){
'use strict';
if(!window.THREE){const e=document.getElementById('err');e.hidden=false;e.textContent='تعذّر تحميل محرك العرض (lib/three.min.js). شغّل اللعبة من سيرفر أو من GitHub Pages.';return;}
const T=THREE;
T.ColorManagement.legacyMode=false;

/* ---------------- constants ---------------- */
const CH=128, CSEG=64, TRAIL_SIZE=320, BOUND=1140, LOCAL=150, DT=1/60;
const SAND_SRGB=[0.851,0.737,0.565];          // #d9bc90 haze / fog colour

/* ---------------- noise + terrain height ---------------- */
function hash(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n);}
function sm(t){return t*t*(3-2*t);}
function noise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=sm(xf),v=sm(zf);
  const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z){return noise(x,z)*0.55+noise(x*2.03+7.1,z*2.03-3.3)*0.3+noise(x*4.1-2.7,z*4.1+9.2)*0.15;}
function smoothstep(a,b,x){const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
const CX=-4, CZ=-2; // compound centre (flat pad)
const START=(()=>{const bx=300,bz=520,dx=-0.57,dz=-0.82;return{x:bx+dx*26,z:bz+dz*26,h:Math.atan2(dx,dz)};})(); // by the badia
const WX=0.8, WZ=0.6; // wind direction (slip faces face downwind)
function ridge(x,z){const n=noise(x,z);const r=1-Math.abs(2*n-1);return r*r;}
function duneRaw(x,z){
  const wx=x+34*(noise(x*0.004+11,z*0.004)-0.5), wz=z+34*(noise(x*0.004,z*0.004+7)-0.5);
  return ridge(wx/80+0.3*wz/80, wz/58)+0.32*ridge(wx/34+4.1,wz/27-2.3);
}
function base(x,z){return 0.7*fbm(x*0.03,z*0.03)+5*noise(x*0.003,z*0.003);}
// world layout: settlements on flattened pads, joined by sand tracks
const SITES=[
  {id:'start',  name:'المخيم',      x:CX,  z:CZ,   r0:20,r1:46, col:'#f2a33a'},
  {id:'village',name:'الحي النجدي', x:430, z:-380, r0:46,r1:92, col:'#e0b07a'},
  {id:'oasis',  name:'الواحة',      x:-470,z:260,  r0:40,r1:84, col:'#7fa05a'},
  {id:'badia',  name:'بيت الشعر',   x:300, z:520,  r0:32,r1:70, col:'#3a2e28'},
  {id:'camp',   name:'مخيم البدو',  x:-600,z:-520, r0:24,r1:56, col:'#c9a27a'},
  {id:'souq',   name:'السوق',       x:483, z:-380, r0:34,r1:66, col:'#b5654a'},
  {id:'caravan',name:'الكرفان',     x:60,  z:-300, r0:30,r1:62, col:'#f3f1ea'}
];
SITES.forEach(t=>t.h=base(t.x,t.z));
SITES[5].h=SITES[1].h; // the souq shares the village's ground level so the two pads meet cleanly
// places where the water tanker gets stuck: gentle sand pans so the player can stop next to it
const SPOTS=[[70,-60,0.6],[-200,40,2.2],[150,300,-0.4],[-540,-150,1.4],[300,-200,2.8],[-90,420,0.2]];
const PANS=SPOTS.map(p=>({x:p[0],z:p[1],r0:8,r1:26,h:base(p[0],p[1])}));

function colored(geo,hex){geo=geo.index?geo.toNonIndexed():geo;const c=new T.Color(hex);const n=geo.attributes.position.count;
  const a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}
  geo.setAttribute('color',new T.BufferAttribute(a,3));geo.deleteAttribute('uv');return geo;}
function merge(list){let n=0;list.forEach(g=>n+=g.attributes.position.count);
  const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;
  list.forEach(g=>{P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);C.set(g.attributes.color.array,o*3);o+=g.attributes.position.count;});
  const m=new T.BufferGeometry();m.setAttribute('position',new T.BufferAttribute(P,3));m.setAttribute('normal',new T.BufferAttribute(N,3));m.setAttribute('color',new T.BufferAttribute(C,3));return m;}

function radialTex(stops){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);

const GLOW_TEX=radialTex([[0,'rgba(255,255,255,1)'],[0.25,'rgba(255,255,255,0.55)'],[1,'rgba(255,255,255,0)']]);
const POOL_TEX=radialTex([[0,'rgba(255,255,255,0.9)'],[0.5,'rgba(255,255,255,0.35)'],[1,'rgba(255,255,255,0)']]);

// lamps = {tails:[sprites], heads:[sprites], rev:[sprites], tailPool, headPool}
function fitLamps(parent,tail,head,scale){

    const h=glowSprite(0xfff0d0,1.0*scale);h.position.set(sd*head.x,head.y,head.z+0.08);parent.add(h);L.heads.push(h);});

function stepCar(dt){
  const fx=Math.sin(S.h),fz=Math.cos(S.h),rx=Math.cos(S.h),rz=-Math.sin(S.h);

/* ---------------- dynamic props step ---------------- */
const _e=new T.Vector3(),_qa=new T.Quaternion(),_mat=new T.Matrix4(),_ax=[new T.Vector3(),new T.Vector3(),new T.Vector3()];
function stepDyn(dt){
  for(const o of dyn){if(o.sleep)continue;
    o.vel.y-=22*dt;o.pos.addScaledVector(o.vel,dt);
    const w=o.av.length();if(w>1e-4){_qa.setFromAxisAngle(_e.copy(o.av).multiplyScalar(1/w),w*dt);o.q.premultiply(_qa).normalize();}
    _mat.makeRotationFromQuaternion(o.q);_mat.extractBasis(_ax[0],_ax[1],_ax[2]);
    const ext=Math.abs(_ax[0].y)*o.half.x+Math.abs(_ax[1].y)*o.half.y+Math.abs(_ax[2].y)*o.half.z;
    const gy=H(o.pos.x,o.pos.z);
    if(o.pos.y-ext<gy){o.pos.y=gy+ext;
      if(o.vel.y<-3){o.vel.y=-o.vel.y*0.28;o.av.multiplyScalar(0.7);if(o.vel.y>2)puff(o.pos.x,o.pos.z,4,1.4);}else o.vel.y=0;

      const tq=_qa.multiply(o.q);o.q.slerp(tq,Math.min(1,4*dt));
      if(o.vel.lengthSq()<0.05&&o.av.lengthSq()<0.1){o.still+=dt;if(o.still>0.6){o.sleep=true;o.vel.set(0,0,0);o.av.set(0,0,0);}}else o.still=0;
    }
    if(Math.abs(o.pos.x-CX)>LOCAL+60||Math.abs(o.pos.z-CZ)>LOCAL+60){o.vel.x*=-0.5;o.vel.z*=-0.5;}
    o.m.position.copy(o.pos);o.m.quaternion.copy(o.q);
  }
}

function updateVisual(dt){
  // terrain-aligned orientation from four wheel contact points
  const fx=Math.sin(S.h),fz=Math.cos(S.h),rx=Math.cos(S.h),rz=-Math.sin(S.h);
  if(!S.air){
    const hf=H(S.x+fx*1.8,S.z+fz*1.8),hb=H(S.x-fx*1.8,S.z-fz*1.8),hr=H(S.x+rx*0.95,S.z+rz*0.95),hl=H(S.x-rx*0.95,S.z-rz*0.95);
    const pitch=Math.atan2(hf-hb,3.6),roll=Math.atan2(hr-hl,1.9);
    S.pitch+=(pitch-S.pitch)*Math.min(1,12*dt);S.roll+=(roll-S.roll)*Math.min(1,12*dt);
  }else{S.pitch+=(-0.08-S.pitch)*Math.min(1,1.5*dt);}
  car.position.set(S.x,S.y,S.z);
  car.rotation.set(0,0,0);car.rotation.order='YXZ';car.rotation.y=S.h;car.rotation.x=-S.pitch;car.rotation.z=S.roll;
  // body lean from lateral load
  const lean=Math.max(-0.09,Math.min(0.09,-(S.vS||0)*0.012-S.yaw*(S.vF||0)*0.004));
  body.rotation.z+=(lean-body.rotation.z)*Math.min(1,8*dt);
  body.rotation.x+=((input.gas&&!S.air?-0.025:0)+(input.brake?0.035:0)-body.rotation.x)*Math.min(1,6*dt);
  wheels.forEach(w=>{if(w.front)w.piv.rotation.y=-input.steer*0.5;w.w.rotation.x+=(S.vF||0)*dt/0.47;});
  // camera: high, angled, lazily follows travel direction
  const sp=S.spd;
  if(sp>4){const vyaw=Math.atan2(S.vx,S.vz);let d=vyaw-camState.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));camState.yaw+=d*Math.min(1,0.9*dt);}
  const portrait=innerHeight>innerWidth;
  const dist=(portrait?34:31)+sp*0.15, hgt=(portrait?30:24)+sp*0.12;
  const tx=S.x-Math.sin(camState.yaw)*dist, tz=S.z-Math.cos(camState.yaw)*dist;
  const ty=Math.max(S.y,H(tx,tz))+hgt;
  const lx=S.x+Math.sin(camState.yaw)*4, lz=S.z+Math.cos(camState.yaw)*4;
  if(!camState.init){camState.pos.set(tx,ty,tz);camState.look.set(lx,S.y,lz);camState.init=true;}
  camState.pos.lerp(_p.set(tx,ty,tz),Math.min(1,2.4*dt));camState.look.lerp(_p.set(lx,S.y,lz),Math.min(1,5*dt));
  if(game.mode==='play'){camera.position.copy(camState.pos);camera.lookAt(camState.look);}
  else{
    const sw=Math.sin(game.clock*0.22)*0.9;
    const tp=_tp.set(S.x+fx*7.2+rx*(2.2+sw),S.y+1.35,S.z+fz*7.2+rz*(2.2+sw)),tl=_tl.set(S.x-fx*0.6,S.y+1.25,S.z-fz*0.6);
    if(game.mode==='title'){camera.position.copy(tp);camera.lookAt(tl);camera.rotateY(innerHeight>innerWidth?0:-0.3);}
    else{game.t+=dt;const k=Math.min(1,game.t/3.4),e=k*k*(3-2*k);
      // rise and swing round from the bumper to the chase position
      const a0=Math.atan2(tp.x-S.x,tp.z-S.z),a1=Math.atan2(camState.pos.x-S.x,camState.pos.z-S.z);let da=a1-a0;da=Math.atan2(Math.sin(da),Math.cos(da));
      const r0=Math.hypot(tp.x-S.x,tp.z-S.z),r1=Math.hypot(camState.pos.x-S.x,camState.pos.z-S.z),a=a0+da*e,r=r0+(r1-r0)*e;
      camera.position.set(S.x+Math.sin(a)*r,tp.y+(camState.pos.y-tp.y)*e+Math.sin(k*Math.PI)*6,S.z+Math.cos(a)*r);
      camera.lookAt(_p.copy(tl).lerp(camState.look,e));
      if(k>=1){game.mode='play';document.body.classList.remove('title','intro');dropHQ();pixelRatio=PLAY_PR;renderer.setPixelRatio(pixelRatio);resize();}}
  }
  skyDome.position.copy(camera.position);
  // sun + shadow box follow car
  sun.position.set(S.x+SUN_DIR.x*120,S.y+SUN_DIR.y*120,S.z+SUN_DIR.z*120);sun.target.position.set(S.x,S.y,S.z);
  // dust light dir in view space
  dustU.uSun.value.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);
  camera.updateMatrixWorld();_p.set(S.x,S.y+1,S.z);const cz=_p.clone().applyMatrix4(camera.matrixWorldInverse).z;_p.project(camera);
  dustU.uCar.value.set(_p.x,_p.y,-cz);dustU.uAspect.value=camera.aspect;
  spdEl.textContent=Math.round(sp*3.6);
  // head-up gauges: pitch and roll read from the ground under the car, front-wheel angle, drive mode by road/sand; the speed sign is decorative
  {const fx=Math.sin(S.h),fz=Math.cos(S.h),pd=v=>String(Math.min(99,Math.round(Math.abs(v)))).padStart(2,'0');
   const pit=Math.atan2(H(S.x+fx*2,S.z+fz*2)-H(S.x-fx*2,S.z-fz*2),4)*57.3,rol=Math.atan2(H(S.x+fz*1,S.z-fx*1)-H(S.x-fz*1,S.z+fx*1),2)*57.3;
   hud.P.textContent=pd(pit);hud.R.textContent=pd(rol);hud.S.textContent=pd(input.steer*34);hud.C.textContent=Math.round(sp*3.6);
   if((hud.k=(hud.k||0)+1)%15===0)hud.WD.textContent=roadDist(S.x,S.z)<9?'2WD':'4WD';}
}

/* ---------------- engine + sand sounds (synthesised with Web Audio, no files) ---------------- */
const snd={ctx:null};window.__snd=snd;
function initSound(){
  if(snd.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=new AC(),out=c.createGain();out.gain.value=0.9;out.connect(c.destination);snd.ctx=c;snd.out=out;
  // engine: a looped buffer of real-ish V8 firing pulses (uneven cross-plane rhythm, each pulse a decaying
  // thump + a little combustion noise). Pitch follows RPM through playbackRate, a low-pass opens with throttle.
  const SR=c.sampleRate,CYC=0.12,NC=10,eb=c.createBuffer(1,Math.round(SR*CYC*NC),SR),ed=eb.getChannelData(0);
  const fire=[0,0.115,0.25,0.365,0.5,0.625,0.75,0.87];                       // cross-plane: slightly uneven gaps
  for(let k=0;k<NC;k++)fire.forEach((ph,j)=>{
    const t0=Math.round(SR*CYC*(k+ph+(Math.random()-0.5)*0.012)),amp=0.75+Math.random()*0.35+(j%2?0:0.12),f=58+Math.random()*10;
    let nlp=0;
    for(let i=0;i<SR*0.05;i++){const t=i/SR,idx=t0+i;if(idx>=ed.length)break;
      const env=Math.exp(-t*55)*(1-Math.exp(-t*900));nlp=nlp*0.82+(Math.random()*2-1)*0.18;
      ed[idx]+=amp*env*(Math.sin(2*Math.PI*f*t)*0.85+Math.sin(2*Math.PI*f*2.02*t)*0.25+nlp*0.9);}
  });
  let pk=0;for(let i=0;i<ed.length;i++)pk=Math.max(pk,Math.abs(ed[i]));for(let i=0;i<ed.length;i++)ed[i]/=pk;

  const lp2=c.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=1800;lp2.Q.value=0.5;
  const shp=c.createWaveShaper();const cv=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;cv[i]=Math.tanh(x*1.4)/Math.tanh(1.4);}shp.curve=cv;

  const eng=c.createGain();eng.gain.value=0;

  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);let last=0;
  for(let i=0;i<nd.length;i++){const w=Math.random()*2-1;last=last*0.6+w*0.4;nd[i]=last;}
  const ns=c.createBufferSource();ns.buffer=nb;ns.loop=true;ns.start();
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=0.8;const sand=c.createGain();sand.gain.value=0;
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;const hiss=c.createGain();hiss.gain.value=0;
  ns.connect(bp);bp.connect(sand);sand.connect(out);ns.connect(hp);hp.connect(hiss);hiss.connect(out);
  Object.assign(snd,{eng,lp,es,sand,bp,hiss,rpm:900,gear:1,wasAir:false});
}

const GEARS=[0,9,17,25,33,99];

  g.gain.setValueAtTime(0.5*k,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);o.connect(g);g.connect(snd.out);o.start(t);o.stop(t+0.4);}
function soundTick(dt){
  if(!snd.ctx||snd.ctx.state!=='running')return;
  const c=snd.ctx,t=c.currentTime,sp=Math.abs(S.vF||0),thr=input.gas?1:0;
  // automatic gearbox; wheelspin and the handbrake let the revs flare
  let g=1;while(g<GEARS.length-2&&sp>GEARS[g])g++;
  if(g!==snd.gear){snd.gear=g;snd.shift=0.12;}
  const lo=GEARS[g-1],hi=GEARS[g],within=Math.min(1,Math.max(0,(sp-lo)/(hi-lo)));
  let target=900+within*4200*(g===1?1:0.85)+(g>1?900:0);
  const spin=(S.air?1:0)+(input.hand&&thr?1:0)+Math.min(1,(S.slip||0)*0.06)*thr;
  target+=spin*1800*thr;if(!thr)target=Math.max(900,target*0.75);
  if(snd.shift>0){snd.shift-=dt;target*=0.8;}
  snd.rpm+=(target-snd.rpm)*Math.min(1,dt*(thr?6:3));
  // buffer recorded at 1000 rpm (one 4-stroke cycle = 0.12 s)
  snd.es.playbackRate.setTargetAtTime(snd.rpm/1000,t,0.04);
  snd.lp.frequency.setTargetAtTime(300+thr*700+snd.rpm*0.09,t,0.06);
  snd.eng.gain.setTargetAtTime(0.2+thr*0.16+Math.min(0.06,sp*0.002),t,0.08);
  // sand spray: grows with slip (drifting, wheelspin) and a little with speed; silent in the air or in water
  const onSand=!S.air&&!S.wet;const slipK=Math.min(1,(S.slip||0)*0.07);
  const grit=onSand?Math.min(0.32,slipK*0.3+sp*0.0025)*(0.85+0.3*Math.random()):0;
  snd.sand.gain.setTargetAtTime(grit,t,0.04);snd.bp.frequency.setTargetAtTime(380+slipK*500,t,0.08);
  snd.hiss.gain.setTargetAtTime(onSand?slipK*0.05:(S.wet&&sp>2?Math.min(0.25,sp*0.015):0),t,0.05);
  if(snd.wasAir&&!S.air)thump(Math.min(1,0.3+Math.abs(S.vy||0)*0.05+0.4));snd.wasAir=S.air;
}

// fetch with byte progress (reports into carLoad, which drives the title-page bar)
const carLoad={got:0,total:0};
async function fetchBytes(url,expect){const r=await fetch(url);if(!r.ok)throw new Error(url+' '+r.status);
  const len=+r.headers.get('content-length')||expect||0;if(!r.body||!r.body.getReader){const b=await r.arrayBuffer();carLoad.got+=b.byteLength;return b;}
  const rd=r.body.getReader(),parts=[];let n=0;for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);n+=value.length;carLoad.got+=value.length;}
  const out=new Uint8Array(n);let o=0;parts.forEach(p=>{out.set(p,o);o+=p.length;});return out.buffer;}

  const ab=track?await fetchBytes(url):await (await fetch(url)).arrayBuffer(),dv=new DataView(ab);

  const view=i=>{const v=j.bufferViews[i];return{off:bo+(v.byteOffset||0),len:v.byteLength};};
  const acc=i=>{const a=j.accessors[i],v=view(a.bufferView),n={SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[a.type]*a.count,
    C={5126:Float32Array,5125:Uint32Array,5123:Uint16Array,5121:Uint8Array}[a.componentType],o=v.off+(a.byteOffset||0);
    return new C(ab.slice(o,o+n*C.BYTES_PER_ELEMENT));};

  g.setAttribute('position',new T.BufferAttribute(acc(pr.attributes.POSITION),3));g.setAttribute('normal',new T.BufferAttribute(acc(pr.attributes.NORMAL),3));
  g.setAttribute('uv',new T.BufferAttribute(acc(pr.attributes.TEXCOORD_0),2));g.setIndex(new T.BufferAttribute(acc(pr.indices),1));

    tex=new T.Texture(img);tex.flipY=false;tex.encoding=T.sRGBEncoding;tex.anisotropy=4;tex.needsUpdate=true;}

// side strip with the emblem, السعودية, K S A and the category mark — blue strip with a down-pointing triangle
function saudiPlate(){

  x.fillStyle='#f7f7f4';R(6,6,W-12,H-12,46);x.fill();x.lineWidth=16;x.strokeStyle='#151515';x.stroke();
  const SX=W-300;                                          // side strip on the right
  x.save();R(6,6,W-12,H-12,46);x.clip();x.fillStyle='#1f5fae';x.fillRect(SX,0,W-SX,H);x.restore();
  x.lineWidth=10;x.strokeStyle='#151515';x.beginPath();x.moveTo(SX,14);x.lineTo(SX,H-14);x.stroke();
  // emblem: palm over two crossed swords (simplified)
  const ex=SX+(W-SX)/2;x.strokeStyle='#fff';x.fillStyle='#fff';x.lineWidth=9;x.lineCap='round';
  x.beginPath();x.moveTo(ex,150);x.lineTo(ex,60);x.stroke();
  for(let i=0;i<7;i++){const a=-Math.PI/2+(i-3)*0.42;x.beginPath();x.moveTo(ex,66);x.quadraticCurveTo(ex+Math.cos(a)*34,66+Math.sin(a)*34-6,ex+Math.cos(a)*58,66+Math.sin(a)*58+10);x.stroke();}
  x.lineWidth=8;[[-1],[1]].forEach(([d])=>{x.beginPath();x.moveTo(ex-d*62,150);x.quadraticCurveTo(ex,170,ex+d*62,118);x.stroke();});
  x.font='bold 66px "Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif';x.textAlign='center';x.textBaseline='middle';x.direction='rtl';x.fillText('السعودية',ex,240);
  x.direction='ltr';x.font='bold 74px Arial,Helvetica,sans-serif';['K','S','A'].forEach((ch,i)=>x.fillText(ch,ex,330+i*78));
  x.beginPath();x.moveTo(ex-34,540);x.lineTo(ex+34,540);x.lineTo(ex,592);x.closePath();x.fill();   // commercial: down-pointing triangle
  // main field: one horizontal and one vertical divider
  x.strokeStyle='#151515';x.lineWidth=9;x.beginPath();x.moveTo(20,H/2);x.lineTo(SX,H/2);x.moveTo(SX/2,24);x.lineTo(SX/2,H-24);x.stroke();
  x.fillStyle='#111';x.textAlign='center';x.textBaseline='middle';
  x.font='bold 168px "Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif';x.direction='rtl';
  x.fillText('٥٤٥٢',SX/4,H/4+14);x.fillText('ب ك ك',SX*3/4,H/4+10);
  x.direction='ltr';x.font='bold 178px "DIN Alternate",Arial,Helvetica,sans-serif';
  x.fillText('5452',SX/4,H*3/4+8);x.fillText('B K K',SX*3/4,H*3/4+8);
  const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  t.onUpdate=null;return t;}
let plates=null;
function fitPlates(m){
  const bb=m.userData.bb,k=m.userData.k,H2=(bb.max.y-bb.min.y)*k;
  if(!plates){const tex=saudiPlate(),mat=new T.MeshStandardMaterial({map:tex,roughness:0.45,metalness:0.05,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:0.32}); // faint self-light keeps it readable in the bumper's shade
    plates=[0,1].map(i=>{const pl=new T.Mesh(new T.PlaneGeometry(0.335,0.155),mat);pl.renderOrder=1;pl.userData.keep=true;body.add(pl);return pl;});
    plates[1].rotation.y=Math.PI;plates.forEach(pl=>pl.scale.setScalar(1.55));} // the model is scaled a bit larger than life, so the plate follows
  plates[0].position.set(0,H2*PLATE.fy,CAR_LEN/2+PLATE.fz);   // front bumper
  plates[1].position.set(0,H2*PLATE.ry,-CAR_LEN/2-PLATE.rz);  // tailgate / rear bumper
}
const PLATE={fy:0.255,fz:0.02,ry:0.33,rz:0.02};
// two versions: the original model as sent (511k triangles, 2048 texture) for the title page only, the light one (25k) for driving
const carModels={light:null,hq:null};
function useCar(m){
  if(!m)return;[carModels.light,carModels.hq].forEach(o=>{if(o&&o!==m)o.visible=false;});m.visible=true;if(!m.parent)body.add(m);
  body.children.forEach(o=>{if(o.isMesh&&!o.userData.keep&&o!==carModels.light&&o!==carModels.hq&&o!==carLamps.tailPool&&o!==carLamps.headPool)o.visible=false;});
  wheels.forEach(w=>w.w.visible=false);           // the model carries its own wheels
  const bb=m.userData.bb,k=m.userData.k,H2=(bb.max.y-bb.min.y)*k,W2=(bb.max.x-bb.min.x)*k;
  carLamps.tails.forEach((sp,i)=>sp.position.set((i?1:-1)*W2*0.4,H2*0.58,-CAR_LEN/2-0.04));
  carLamps.rev.forEach((sp,i)=>sp.position.set((i?1:-1)*W2*0.3,H2*0.58,-CAR_LEN/2-0.04));
  carLamps.heads.forEach((sp,i)=>sp.position.set((i?1:-1)*W2*0.36,H2*0.53,CAR_LEN/2+0.05));
  carLamps.tailPool.position.z=-CAR_LEN/2-1.6;
  heads.forEach((l,i)=>l.position.set((i?1:-1)*W2*0.32,H2*0.52,CAR_LEN/2-0.1));
  fitPlates(m);window.__carModel=m;}
// when the drive starts, swap the detailed car for the light one and free the detailed one
function dropHQ(){const m=carModels.hq;if(!m)return;carModels.hq=null;if(carModels.light)useCar(carModels.light);
  body.remove(m);m.geometry.dispose();if(m.material.map)m.material.map.dispose();m.material.dispose();}
// title page shows only the original model; the light one waits hidden until driving starts (or the original fails to load)
let origFailed=false;
loadCar('car').then(d=>{carModels.light=carMesh(d);if(game.mode==='play'||origFailed)useCar(carModels.light);else{carModels.light.visible=false;body.add(carModels.light);}})
  .catch(e=>{console.warn('car model',e);if(!carModels.hq)showProcCar(true);});
carLoad.total=17313216;   // original .glb (repo); the published page uses the split files below
loadGLB('models/car_orig.glb',true).catch(()=>{carLoad.got=0;carLoad.total=22738956;return loadCarSplit('car_orig');}).then(d=>{carLoadDone();if(game.mode==='play'){d.g.dispose();return;}carModels.hq=carMesh(d);carModels.hq.material.map.anisotropy=8;useCar(carModels.hq);})
  .catch(e=>{console.warn('original car',e);origFailed=true;carLoadDone();if(carModels.light&&game.mode!=='play')useCar(carModels.light);});

/* ---------------- loop ---------------- */
let mapT=0,wT=0;
function worldTick(dt,now){
  wT+=dt;game.clock+=dt;
  updateChunks(S.x,S.z,1);recenterTrail(S.x,S.z);
  soundTick(dt);envTick(dt);if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.hidden=true;}
  if(AAok){pumpQueue(queue.length>queueTotal*0.7?22:14);stepActors(dt);stepMovers(dt);stepTow(dt);AA.three.uniforms.uTime.value=wT;}
  mapT-=dt;if(mapT<=0){mapT=0.15;drawMap();}
}
/* title screen */
document.body.classList.add('title');
document.getElementById('start').addEventListener('click',()=>{if(game.mode!=='title')return;game.mode='intro';game.t=0;document.body.classList.add('intro');initSound();if(!station)tune(1); // radio starts with the same tap as the engine
  // full screen + landscape where the browser allows it (hides the bars, so fewer edge swipes); ignored where refused
  try{const el=document.documentElement,fs=el.requestFullscreen||el.webkitRequestFullscreen;if(fs){const pr=fs.call(el,{navigationUI:'hide'});if(pr&&pr.then)pr.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}}catch(e){}
  if(!carModels.hq&&carModels.light)useCar(carModels.light); // original not ready yet: drive the light one
  
  if(snd.ctx&&snd.ctx.state==='suspended')snd.ctx.resume();});
let last=performance.now(),acc=0,simT=0;
window.__state=S;window.__dbg={sun,tMat,renderer,scene,dust,hemi,car,camera};
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;
  readInput(simT);
  let steps=0;while(acc>=DT&&steps<5){stepCar(DT);stepDyn(DT);carEffects(DT);stepParticles(DT);acc-=DT;simT+=DT;steps++;}
  if(steps===5)acc=0;
  updateVisual(dt);
  worldTick(dt,now);
  flushStamps();
  renderer.render(scene,camera);
  if(!window.__autopilot)adapt(dt);
  requestAnimationFrame(frame);
}
// test hook: advance simulation deterministically without rAF timing
window.__advance=function(sec){const n=Math.round(sec/DT);for(let i=0;i<n;i++){readInput(simT);stepCar(DT);stepDyn(DT);carEffects(DT);stepParticles(DT);simT+=DT;updateVisual(DT);worldTick(DT,0);if(i%4===0)flushStamps();}flushStamps();renderer.render(scene,camera);};
window.__world={PLATE,fitPlates,SIMP,queue,actors,SITES,chunks,S,env,WADI,LAKE,tow,movers,teleport:(x,z,h)=>{S.x=x;S.z=z;S.h=h||0;S.vx=S.vz=0;updateChunks(x,z,25);S.y=H(x,z);camState.yaw=S.h;camState.init=false;}};
updateVisual(DT);
window.__noLoop?renderer.render(scene,camera):requestAnimationFrame(frame);
})();
